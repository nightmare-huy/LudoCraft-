name: Build and release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo 'Invalid mod_version in gradle.properties' >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate 3D model and textures
        run: |
          python3 -m venv .model-tools
          .model-tools/bin/pip install Pillow==13.0.0
          .model-tools/bin/python tools/check_pickaxe_model.py
          .model-tools/bin/python tools/check_punchy_compat.py
          .model-tools/bin/python tools/check_punchy_reference.py
      - name: Build and test
        shell: bash
        run: |
          if ! ./gradlew build runGameTestServer runEvolutionGameTestServer --no-daemon > build-output.log 2>&1; then
            tail -80 build-output.log
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::$line"
            done < <(tail -45 build-output.log)
            exit 1
          fi
          cat build-output.log
          # An early, clean server exit (e.g. missing EULA) is not a successful test run.
          grep -Fq 'All 8 required tests passed' build-output.log || { echo '::error::Missing default GameTest completion'; exit 1; }
          grep -Fq 'All 2 required tests passed' build-output.log || { echo '::error::Missing Evolution GameTest completion'; exit 1; }
          grep -Fq 'PASS: Evolution 1.47.0' build-output.log || { echo '::error::Missing Evolution rule tests'; exit 1; }
          echo '::notice::Verified: default 8/8, Evolution preset 2/2 GameTests, pure Evolution rule tests.'
      - name: Inspect pickaxe in a real client world
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxi6 libxrender1 libxtst6
          if ! timeout 420s xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew runModelSmokeClient --no-daemon > client-model-test.log 2>&1; then
            tail -100 client-model-test.log
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::$line"
            done < <(tail -45 client-model-test.log)
            exit 1
          fi
          grep -Fq 'PICKAXE_MODEL_SMOKE_PASS:' client-model-test.log || { echo '::error::Client never confirmed model baking'; tail -80 client-model-test.log; exit 1; }
          grep -Fq 'HAND_POSE_WORLD_PASS:' client-model-test.log || { echo '::error::World pose inspection did not complete'; tail -80 client-model-test.log; exit 1; }
          test "$(find run/model-smoke/screenshots -name 'hand-*.png' | wc -l)" -eq 7
          .model-tools/bin/python tools/check_hand_captures.py
          echo '::notice::Real client: model bake and seven non-empty in-world hand/side/swing screenshots completed.'
      - name: Verify distributable contents
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          from pathlib import Path
          jar = glob.glob('build/libs/ludocraft-*.jar')
          assert len(jar) == 1
          with zipfile.ZipFile(jar[0]) as z:
              assert not any('/gametest/' in n or n.startswith('data/ludocraft_evolution/') for n in z.namelist())
              marker = 'data/ludocraft/tags/item/balance/ftb_evolution_1_47_0.json'
              assert json.loads(z.read(marker))['values'] == []
              model = 'assets/ludocraft/models/item/gamblers_pickaxe.json'
              texture = 'assets/ludocraft/textures/item/gamblers_pickaxe_3d.png'
              assert z.read(model) == Path('src/main/resources', model).read_bytes()
              assert z.read(texture) == Path('src/main/resources', texture).read_bytes()
              assert len(json.loads(z.read(model))['elements']) == 241
              compat = 'assets/minecraft/punchy/compat/ludocraft_gamblers_pickaxe.json'
              assert z.read(compat) == Path('src/main/resources', compat).read_bytes()
              assert not any(n.startswith('punchy/') or n.endswith('.jar') for n in z.namelist())
          pack = glob.glob('build/libs/*-ftb-evolution-1.47.0.zip')
          assert len(pack) == 1
          with zipfile.ZipFile(pack[0]) as z:
              assert json.loads(z.read('pack.mcmeta'))['pack']['pack_format'] == 48
              assert json.loads(z.read(marker))['values'] == ['ludocraft:pocket_ludka']
              assert not any('test-overrides' in n or n.endswith('.class') for n in z.namelist())
          print('::notice::Verified JAR opt-out marker, ZIP opt-in marker, format 48 and test-code exclusion.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-hand-captures
          path: run/model-smoke/screenshots/hand-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ludocraft-1.21.1
          path: |
            build/libs/ludocraft-${{ steps.version.outputs.version }}.jar
            build/libs/ludocraft-${{ steps.version.outputs.version }}-ftb-evolution-1.47.0.zip
          if-no-files-found: error

  punchy:
    uses: ./.github/workflows/punchy.yml
    permissions:
      contents: write

  release:
    needs: [build, punchy]
    # Never publish from pull requests or unrelated branches/forks.
    if: >-
      github.repository == 'nightmare-huy/LudoCraft-' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/arena/70f21d2d-ludocraft' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ludocraft-releases
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ludocraft-1.21.1
          path: release
      - name: Publish versioned JAR to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          # A failed API request fails the job, rather than looking like a missing release.
          tags=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')
          if grep -Fxq -- "$tag" <<< "$tags"; then
            echo "::notice::Release $tag already exists. Bump mod_version to publish another version; existing files will not be replaced."
            exit 0
          fi
          jar="ludocraft-${VERSION}.jar"
          test -s "release/$jar"
          preset="ludocraft-${VERSION}-ftb-evolution-1.47.0.zip"
          test -s "release/$preset"
          (cd release && sha256sum "$jar" "$preset" > SHA256SUMS.txt)
          cat > release/notes.md <<'NOTES'
          ## LudoCraft — Кирка Лудомании и Карманная Лудка

          **Minecraft Java 1.21.1 · NeoForge 21.1.265+ для 1.21.1 · Java 21**

          Скачайте `ludocraft-*.jar` из Assets и положите его в папку `mods` клиента и сервера. Архивы Source code для установки не нужны.

          Получение: `/give @s ludocraft:gamblers_pickaxe` и `/give @s ludocraft:pocket_ludka`.
          Проверяйте механику в выживании, не в творческом режиме.

          Алмазная кирка: 85% — без предметов и опыта, 15% — дроп ×2–×5, звук «777», конфетти и визуальные фейерверки.

          Новое в 1.5.4: first-person-положение Кирки Лудомании совпадает с реальными transforms обычной алмазной кирки в Punchy 3.2b (NeoForge 1.21.1). Отдельный item-only профиль для ludocraft:gamblers_pickaxe равен стандартной позе Punchy pickaxe; обе руки. Модель, текстура, 241 quad, третье лицо, механика 85/15 и баланс не изменены. Punchy необязателен, в JAR не включён; отдельный ресурс-пак не нужен.

          Проверено с точным punchy-3.2b-neoforge-1.21.1.jar (SHA-512), стандартный конфиг: фактическое совпадение Punchy profiles и baked first-person transforms с vanilla diamond pickaxe в обеих руках; игровой мир, взгляд вниз, F5, добыча камня в выживании и восстановление. Кадры: docs/previews/v1.5.4. Это автоматизированная сцена, не ручное прохождение полной сборки; пользовательские конфиги, шейдеры и все фазы анимаций не проверены.

          Также пройдены обычный клиентский запуск без Punchy, тесты геометрии/текстур, 8+2 GameTests, чистые правила и проверка JAR. Релиз заблокирован при провале любого из двух клиентских запусков.

          Карманная Лудка: опциональный консервативный профиль FTB Evolution 1.47.0. Обычный режим 1.4.0 сохранён, профиль НЕ включается автоматически.

          Если профиль Evolution 1.5.0 уже установлен, оставьте его: повторный ZIP не нужен. Для новой установки профиля: ZIP `ludocraft-*-ftb-evolution-1.47.0.zip` целиком в `<мир>/datapacks/` (на сервере — в папку серверного мира), затем `/reload` и заново открыть Лудку. В заголовке появится EVOLUTION 1.47.0. ZIP не класть в mods и не распаковывать внутрь другого datapack.

          Проверены официальные manifest 125/100598 и отдельные KubeJS-скрипты 1.47.0. FTB Materials и эквивалентные ресурсы оценены согласованно. Пример: алмаз 32, незерит 512, AE2 controller 2048, item cell 1k 640. Неоценённые модовые вещи: ставка не более 32, награда не менее 512; это намеренный разрыв, а не одинаковая цена покупки/ставки.

          Защищённые цели: скрытые c:hidden_from_recipe_viewers, руды/сырьё, compressedblocks, непроверенные кастомные ftbevolution-предметы (кроме ruby_gem/xy_aluminum_dust), chaos-компоненты Draconic Evolution, антиматерия Mekanism и nucleosynthesizer, creative_* / *_creative. Как ставки они разрешены, если не запрещены общим blacklist. Профиль не отслеживает персональный прогресс и не гарантирует закрытие всех обходов рецептов. MEGACells упирается в потолок цены 32767.

          Сервер выбирает исход, расходуется один предмет. Победа создаёт один стандартный экземпляр цели, не копируя содержимое/заряд ставки. Кирка 85/15 и трёхсекундная анимация не изменены.

          CI: чистые тесты правил, обычный GameTest-сервер и отдельный GameTest-сервер с настоящим datapack-профилем. Полная FTB Evolution не запускается; клиентская проверка использует отдельный плоский мир с одним LudoCraft. Это первый экспериментальный баланс, не полный аудит экономики сборки. Документация: docs/balance/ftb-evolution-1.47.0.md.
          NOTES
          gh release create "$tag" "release/$jar" "release/$preset" release/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "LudoCraft ${VERSION} — Minecraft 1.21.1" \
            --notes-file release/notes.md
