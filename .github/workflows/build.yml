name: Build and release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo 'Invalid mod_version in gradle.properties' >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test
        shell: bash
        run: |
          if ! ./gradlew build runGameTestServer --no-daemon > build-output.log 2>&1; then
            tail -80 build-output.log
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::$line"
            done < <(tail -45 build-output.log)
            exit 1
          fi
          cat build-output.log
      - uses: actions/upload-artifact@v4
        with:
          name: ludocraft-1.21.1
          path: build/libs/ludocraft-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

  release:
    needs: build
    # Never publish from pull requests or unrelated branches/forks.
    if: >-
      github.repository == 'nightmare-huy/LudoCraft-' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/arena/70f21d2d-ludocraft' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ludocraft-releases
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ludocraft-1.21.1
          path: release
      - name: Publish versioned JAR to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          # A failed API request fails the job, rather than looking like a missing release.
          tags=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')
          if grep -Fxq -- "$tag" <<< "$tags"; then
            echo "::notice::Release $tag already exists. Bump mod_version to publish another version; existing files will not be replaced."
            exit 0
          fi
          jar="ludocraft-${VERSION}.jar"
          test -s "release/$jar"
          (cd release && sha256sum "$jar" > SHA256SUMS.txt)
          cat > release/notes.md <<'NOTES'
          ## LudoCraft — Кирка Лудомании и Карманная Лудка

          **Minecraft Java 1.21.1 · NeoForge 21.1.265+ для 1.21.1 · Java 21**

          Скачайте `ludocraft-*.jar` из Assets и положите его в папку `mods` клиента и сервера. Архивы Source code для установки не нужны.

          Получение: `/give @s ludocraft:gamblers_pickaxe` и `/give @s ludocraft:pocket_ludka`.
          Проверяйте механику в выживании, не в творческом режиме.

          Алмазная кирка: 85% — без предметов и опыта, 15% — дроп ×2–×5, звук «777», конфетти и визуальные фейерверки.

          Карманная Лудка 1.3.0: выберите желаемый предмет в каталоге Minecraft и установленных модов. Поиск по названию/ID, фильтры редкости, страницы. Шанс автоматически рассчитывается сервером по ценности ОДНОГО предмета ставки и цели, от 0.0015% до 95% при стандартных оценках.

          Земля (1), алмаз (128) и незеритовый слиток (2048) неравноценны. Земля → незерит: 0.0244%, алмаз → незерит: 3.1250%. Пять категорий редкости, оценки модовых предметов и теги датапака для переоценки. Разрешены все обычные типы предметов; технические блоки и blacklist исключены.

          Победа выдаёт ровно один выбранный предмет в стандартном состоянии. Трёхсекундная рулетка сохранена. При проигрыше ставка сгорает; остальной стак остаётся. Иконки в каталоге не являются инвентарными слотами и не выдают предметы по клику.

          Собрано Gradle на Java 21. Пройдены проверки вероятностей/анимации и серверные GameTests. Ручная проверка отрисовки GUI и звука в клиенте пока не выполнена.
          NOTES
          gh release create "$tag" "release/$jar" release/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "LudoCraft ${VERSION} — Minecraft 1.21.1" \
            --notes-file release/notes.md
