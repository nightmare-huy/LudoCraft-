name: Punchy 3.2b compatibility
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/arena/70f21d2d-ludocraft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch exact optional runtime
        run: python3 tools/fetch_punchy.py
      - name: Image validation tools
        run: |
          python3 -m venv .model-tools
          .model-tools/bin/pip install Pillow==13.0.0
      - name: Capture actual client with Punchy defaults
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxi6 libxrender1 libxtst6
          if ! timeout 480s xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew runPunchySmokeClient --no-daemon > punchy-client.log 2>&1; then
            tail -100 punchy-client.log
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::$line"
            done < <(tail -45 punchy-client.log)
            exit 1
          fi
          grep -Fq 'PUNCHY_RUNTIME_CONFIRMED: 3.2b' punchy-client.log
          grep -Fq 'HAND_POSE_WORLD_PASS:' punchy-client.log
          grep -Fq 'PUNCHY_MINING_PASS:' punchy-client.log
          grep -Fq 'PUNCHY_COMPAT_PASS:' punchy-client.log
          test "$(find run/punchy-smoke/screenshots -name 'punchy-*.png' | wc -l)" -eq 11
          .model-tools/bin/python tools/check_punchy_captures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punchy-3.2b-hand-captures
          path: run/punchy-smoke/screenshots/punchy-*.png
          if-no-files-found: warn
