plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

// Dependency-free executable tests can also be run with plain javac/java.
tasks.register('ruleTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.ludocraft.gameplay.GamblingRulesTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named('check') { dependsOn tasks.named('ruleTest') }
// Tests below have their own main entry point, not a JUnit test engine.
tasks.named('test') { enabled = false }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
idea.module { downloadSources = true }

// Integration tests run from the development classpath, not in the distributed mod.
tasks.named('jar', Jar) {
    exclude 'ru/ludocraft/gametest/**'
    exclude 'data/ludocraft/structure/ludka_test.nbt'
}
